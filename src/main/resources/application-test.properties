# Perfil de teste: banco H2 em memória, sempre vazio ao iniciar.
# Uso: mvn spring-boot:run -Dspring-boot.run.profiles=test
spring.datasource.url=jdbc:h2:mem:medicare;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
